CH34.name=盜賊手套
CH34.bonus=竊取另一位玩家一張面朝上的<span class="cursed-item">被詛咒的物品</span>。必須立刻使用。<br />被偷取的玩家立即從<span class="cursed-item">被詛咒的物品</span>牌堆中抽取一張新的替代。
CH35.name=廢品站地圖
CH35.bonus=拿取<span class="cursed-item">被詛咒的物品</span>棄牌堆頂部 3 張中的其中一張，立刻將它打出。
CH36.name=飛翼短靴
CH36.bonus=將抽牌堆上的第一張卡牌直接放到棄牌區。
CH37.name=變形手杖
CH37.bonus=將手中的 3-8 張卡牌放回抽牌堆底部，從抽牌堆頂部抽取等量的卡牌。
CH38.name=釘耙
CH38.bonus=從棄牌區拿取 2 張卡牌，然後棄掉 2 張卡牌。
CH39.name=寶箱
CH39.bonus=遊戲結束時，如果擁有至少 3 張面朝下的<span class="cursed-item">被詛咒的物品</span>面朝下則 +25。
CH40.name=魚鉤
CH40.bonus=從抽牌堆抽取 2 張卡牌，然後再棄置任意 2 張卡牌。
CH41.name=維修工具
CH41.bonus=複製任何一張已經使用的<span class="cursed-item">被詛咒的物品</span>的能力，除了<span class="cursed-item">背包</span>、<span class="cursed-item">石棺</span>、<span class="cursed-item">眼罩</span>和<span class="cursed-item">寶箱</span>。<br />如果沒有面朝下的<span class="cursed-item">被詛咒的物品</span>，棄置此卡牌並重新抽取一張。
CH42.name=沙漏
CH42.bonus=執行一個額外的回合。在第二個回合之前不要使用新的<span class="cursed-item">被詛咒的物品</span>替換此卡。
CH43.name=金鏡
CH43.bonus=將棄牌區的 3 張卡牌放到抽牌堆底部。<br />用抽牌堆頂部的 3 張卡牌代替它們
CH44.name=藥鍋
CH44.bonus=從抽牌堆抽取 3 張卡牌而不是一張，然後將其中 2 張放到抽牌堆頂部或底部（或各一張），之後正常棄牌。
CH45.name=提燈
CH45.bonus=指明一種類別。從抽牌堆頂部抽牌直到抽到一張那種類別的卡牌，或者直到抽滿十張牌（通用卡不算）.<br />如果抽到了指明類別的一張牌，保留它並棄掉另一張牌。<br />展示抽到的卡牌並重洗抽牌堆。
CH46.name=入口
CH46.bonus=本回合跳過棄牌階段。<br />（從現在開始手中將擁有一張額外的牌）。
CH47.name=許願戒指
CH47.bonus=查看抽牌堆並將任意一張牌放到抽牌堆頂部。<br />（可以在抽取卡牌前立即這麼做）。<br />在回合結束時重洗抽牌堆。
timing.any-time=任何時間
timing.replace-turn=替換回合
timing.copy=複製卡牌複製時
timing.after-turn=回合之後
