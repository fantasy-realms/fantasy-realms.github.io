FR01.name=Montagna
FR01.bonus=+50 con <b>Fumo</b> e <b>Incendio</b>. <br />RIMUOVI le Penalità su tutte le carte <span class="flood">ACQUA</span>.
FR02.name=Caverna
FR02.bonus=+25 con <b>Fanteria Nanica</b> o <b>Drago</b>. <br />RIMUOVI le Penalità su tutte le carte <span class="weather">ARIA</span>.
FR03.name=Campanile
FR03.bonus=+15 con una carta <span class="wizard">MAGO</span>.
FR04.name=Foresta
FR04.bonus=+12 per ogni carta <span class="beast">BESTIA</span> e <b>Arcieri Elfici</b>.
FR05.name=Elementale della Terra
FR05.bonus=+15 per ogni altra carta <span class="land">TERRA</span>.
FR06.name=Fontana della Vita
FR06.bonus=Aggiungi la forza base di una carta <span class="weapon">ARMA</span>, <span class="flood">ACQUA</span>, <span class="flame">FUOCO</span>, <span class="land">TERRA</span> o <span class="weather">ARIA</span> nella tua mano.
FR07.name=Palude
FR07.penalty=-3 per ogni carta <span class="army">ESERCITO</span> e <span class="flame">FUOCO</span>.
FR08.name=Inondazione
FR08.penalty=ANNULLA tutte le carte <span class="army">ESERCITO</span>, <span class="land">TERRA</span> tranne <b>Montagna</b>, <span class="flame">FUOCO</span> tranne <b>Fulmine</b>.
FR09.name=Isola
FR09.bonus=RIMUOVI la Penalità su una carta <span class="flood">ACQUA</span> o <span class="flame">FUOCO</span>.
FR09.action=Scegli una carta Aqua o Fuoco dalla tua mano per rimuovere la penalità.
FR10.name=Elementale dell'Acqua
FR10.bonus=+15 per ogni altra carta <span class="flood">ACQUA</span>.
FR11.name=Tempesta
FR11.bonus=+10 per ogni carta <span class="flood">ACQUA</span>.
FR11.penalty=ANNULLA tutte le carte <span class="flame">FUOCO</span> tranne <b>Fulmine</b>.
FR12.name=Tormenta
FR12.penalty=ANNULLA tutte le carte <span class="flood">ACQUA</span>. <br />-5 per ogni carta <span class="army">ESERCITO</span>, <span class="leader">LEADER</span>, <span class="beast">BESTIA</span> e <span class="flame">FUOCO</span>.
FR13.name=Fumo
FR13.penalty=Questa carta è ANNULLATA se non hai almeno una carta <span class="flame">FUOCO</span>.
FR14.name=Vortice
FR14.bonus=+40 con <b>Tempesta</b> e una tra <b>Tormenta</b> e <b>Inondazione</b>.
FR15.name=Elementale dell'Aria
FR15.bonus=+15 per ogni altra carta <span class="weather">ARIA</span>.
FR16.name=Incendio
FR16.penalty=ANNULLA tutte le carte tranne quelle <span class="artifact">ARTEFATTO</span>, <span class="flame">FUOCO</span>, <span class="weapon">ARMA</span>, <span class="weather">ARIA</span>, <span class="wizard">MAGO</span>, <b>Inondazione</b>, <b>Isola</b>, <b>Montagna</b>, <b>Unicorno</b> e <b>Drago</b>.
FR17.name=Candela
FR17.bonus=+100 con <b>Tomo del Mutamento</b>, <b>Campanile</b> e un <span class="wizard">MAGO</span>.
FR18.name=Forgia
FR18.bonus=+9 per ogni carta <span class="weapon">ARMA</span> e <span class="artifact">ARTEFATTO</span>.
FR19.name=Fulmine
FR19.bonus=+30 con <b>Tempesta</b>.
FR20.name=Elementale del Fuoco
FR20.bonus=+15 per ogni altra carta <span class="flame">FUOCO</span>.
FR21.name=Cavalieri
FR21.penalty=-8 se non hai almeno una carta <span class="leader">LEADER</span>.
FR22.name=Arcieri Elfici
FR22.bonus=+5 se non hai carte <span class="weather">ARIA</span>.
FR23.name=Cavalleria Leggera
FR23.penalty=-2 per ogni carta <span class="land">TERRA</span>.
FR24.name=Fanteria Nanica
FR24.penalty=-2 per ogni altra carta <span class="army">ESERCITO</span>.
FR25.name=Ranger
FR25.bonus=+10 per ogni carta <span class="land">TERRA</span>. <br />RIMUOVI la parola <span class="army">ESERCITO</span> da tutte le Penalità, tranne per <b>Dirigibile da Guerra</b>.
FR26.name=Collezionista
FR26.bonus=+10 se hai 3 carte diverse nello stesso seme; +40 se ne hai 4; +100 se ne hai 5.
FR27.name=Addestratrice
FR27.bonus=+9 per ogni carta <span class="beast">BESTIA</span>. <br />RIMUOVI le Penalità sulle carte <span class="beast">BESTIA</span>.
FR28.name=Necromante
FR28.bonus=Alla fine della partita puoi prendere in mano una carta <span class="army">ESERCITO</span>, <span class="leader">LEADER</span>, <span class="wizard">MAGO</span>, o <span class="beast">BESTIA</span> dagli scarti.
FR29.name=Warlock
FR29.penalty=-10 per ogni altra carta <span class="wizard">Mago</span> e ogni carta <span class="leader">LEADER</span>.
FR30.name=Incantatrice
FR30.bonus=+5 per ogni carta <span class="land">TERRA</span>, <span class="weather">ARIA</span>, <span class="flood">ACQUA</span> y <span class="flame">FUOCO</span>.
FR31.name=Re
FR31.bonus=+5 per ogni carta <span class="army">ESERCITO</span>. <br />OPPURE <br />Se con la <b>Regina</b>, +20 per ogni carta <span class="army">ESERCITO</span>.
FR32.name=Regina
FR32.bonus=+5 per ogni carta<span class="army">ESERCITO</span>. <br />OPPURE <br />Se con il <b>Rey</b>, +20 per ogni carta <span class="army">ESERCITO</span>.
FR33.name=Principessa
FR33.bonus=+8 per ogni carta <span class="army">ESERCITO</span>, <span class="wizard">MAGO</span> e altri <span class="leader">LEADER</span>.
FR34.name=Signore della Guerra
FR34.bonus=Somma la forza base di tutte le carte <span class="army">ESERCITO</span>.
FR35.name=Imperatrice
FR35.bonus=+10 per ogni carta <span class="army">ESERCITO</span>.
FR35.penalty=-5 per ogni altra carta <span class="leader">LEADER</span>.
FR36.name=Unicorno
FR36.bonus=+30 se con <b>Principessa</B>. <br />OPPURE <br />+15 con <b>Imperatrice</b>, <b>Regina</b>, o <b>Incantatrice</b>.
FR37.name=Basilisco
FR37.penalty=ANNULLA tutte le carte <span class="army">ESERCITO</span>, <span class="leader">LEADER</span> e le altre <span class="beast">BESTIA</span>.
FR38.name=Cavallo da Guerra
FR38.bonus=+14 se con una carta <span class="leader">LEADER</span> o <span class="wizard">MAGO</span>.
FR39.name=Drago
FR39.penalty=-40 se non hai almeno una carta <span class="wizard">MAGO</span>.
FR40.name=Idra
FR40.bonus=+28 se con <b>Palude</b>.
FR41.name=Nave da Guerra
FR41.bonus=RIMUOVI la parola <span class="army">ESERCITO</span> da tutte le Penalità delle carte <span class="flood">ACQUA</span>.
FR41.penalty=ANNULLATA se non hai almeno una carta <span class="flood">ACQUA</span>.
FR42.name=Bacchetta Magica
FR42.bonus=+25 se con una carta<span class="wizard">MAGO</span>.
FR43.name=Spada di Keth
FR43.bonus=+10 con una carta <span class="leader">LEADER</span>. <br />OPPURE <br />+40 se con una carta <span class="leader">LEADER</span> e <b>Scudo di Keth</b>.
FR44.name=Arco Lungo Elfico
FR44.bonus=+30 con <b>Arcieri Elfici</b>, <b>Signore della Guerra</b> o <b>Addestratrice</b>.
FR45.name=Dirigibile da Guerra
FR45.penalty=ANNULLATO se non hai almeno una carta <span class="army">ESERCITO</span>. <br />ANNULLATO se hai almeno una carta<span class="weather">ARIA</span>.
FR46.name=Scudo di Keth
FR46.bonus=+15 se con un <span class="leader">LEADER</span>. <br />OPPURE <br />+40 se con una carta <span class="leader">LEADER</span> e <b>Spada di Keth</b>.
FR47.name=Gemma dell'Ordine
FR47.bonus=+10 se hai 3 carte con forza base in sequenza; +30 se 4 carte; +60 se 5 carte; +100 se 6 carte; +150 se 7 carte.
FR48.name=Albero del Mondo
FR48.bonus=+70 se ogni carta non ANNULLATA della tua mano è di un seme diverso.
FR49.name=Tomo del Mutamento
FR49.bonus=Puoi cambiare il seme di un’altra carta nella tua mano. Il suo nome, i Bonus e le Penalità restano uguali.
FR49.action=Scegli un seme e la carta nella tua mano che subirà il cambio.
FR50.name=Runa di Protezione
FR50.bonus=RIMUOVI tutte le Penalità.
FR51.name=Mutaforma
FR51.bonus=Copia il nome e il seme di una carta <span class="artifact">ARTEFATTO</span>, <span class="LEADER">Líder</span>, <span class="wizard">MAGO</span>, <span class="weapon">ARMA</span> o <span class="beast">BESTIA</span> del gioco. <br />Non copia la forza base, i Bonus o le Penalità.
FR51.action=Scegli una carta da copiare.
FR52.name=Miraggio
FR52.bonus=Copia il nome e il seme di una carta <span class="army">ESERCITO</span>, <span class="land">TERRA</span>, <span class="weather">ARIA</span>, <span class="flood">ACQUA</span> o <span class="flame">FUOCO</span> del gioco. <br />Non copia la forza base, i Bonus o le Penalità.
FR52.action=Scegli una carta da copiare.
FR53.name=Doppelgänger
FR53.bonus=Copia il nome, il seme, la forza base e la Penalità (ma non i Bonus) di un’altra carta che hai in mano.
FR53.action=Scegli dalla tua mano una carta da copiare.
FR54.name=Giullare
FR54.bonus=+3 per ogni altra carta di forza base dispari. <br />OPPURE <br />+50 se tutta la mano è composta di carte di forza base dispari.
FR55.name=Fenice																				
FR55.bonus=Conta anche come carta <span class="flame">FUOCO</span> e <span class="weather">ARIA</span>.
FR55.penalty=ANNULLATA se con una carta <span class="flood">ACQUA</span>. La <b>Fenice</b> è immune al <b>Tomo del Mutamento</b> e non può ANNULLARE o essere ANNULLATA da altre carte.
